google_drive:
  client_id: ""      # use environment variable PDI_GOOGLE_CLIENT_ID
  client_secret: ""  # use environment variable PDI_GOOGLE_CLIENT_SECRET
  token_file: token.json

ignore:
  patterns:
    - node_modules
    - .git
    - Thumbs.db
    - desktop.ini
    - "*.tmp"
    - "*.cache"
  respect_gitignore: true

logging:
  level: info  # debug | info | warn | error
