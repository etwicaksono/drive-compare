database:
  host: localhost
  port: 5432
  user: inventory
  password: ""  # use environment variable PDI_DB_PASSWORD
  name: personal_digital_inventory
  sslmode: disable

google_drive:
  client_id: ""      # use environment variable PDI_GOOGLE_CLIENT_ID
  client_secret: ""  # use environment variable PDI_GOOGLE_CLIENT_SECRET
  token_file: token.json

ignore:
  - node_modules
  - .git
  - Thumbs.db
  - desktop.ini
  - "*.tmp"
  - "*.cache"

logging:
  level: info  # debug | info | warn | error
